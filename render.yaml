databases:
  - name: vms-postgres
    databaseName: vms
    user: vms
    plan: free

services:
  - type: keyvalue
    name: vms-redis
    plan: free
    ipAllowList: []

  - type: web
    name: vms-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vms-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: vms-redis
          type: keyvalue
          property: connectionString
      - key: WEB_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: QR_SIGNING_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: MAX_PREAPPROVALS_PER_HOST_PER_DAY
        value: '5'
      - key: OVERSTAY_MINUTES
        value: '480'
      - key: PENDING_APPROVAL_TIMEOUT_MINUTES
        value: '30'
      - key: PUBLIC_RATE_LIMIT_WINDOW_MS
        value: '60000'
      - key: PUBLIC_RATE_LIMIT_MAX
        value: '30'
      - key: MAIL_FROM
        value: vms@example.com
      # No hosted email/object storage wired up yet — email send and photo upload fail soft
      # (see docs/decisions.md); SMTP_HOST/MINIO_* intentionally left at their local defaults.

  - type: worker
    name: vms-worker
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    dockerCommand: node dist/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vms-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: vms-redis
          type: keyvalue
          property: connectionString
      - key: WEB_URL
        sync: false
      # Not cryptographically used by the worker (no JWT verification happens there) — the
      # env schema just requires *some* value ≥10 chars, so these don't need to match the API's.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: QR_SIGNING_SECRET
        generateValue: true
      - key: OVERSTAY_MINUTES
        value: '480'
      - key: MAIL_FROM
        value: vms@example.com
